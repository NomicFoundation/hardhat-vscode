# Fails if a PR does not add a changeset. Exempt: the Version Packages PR,
# which removes the changesets rather than adding one, and any PR labeled
# "no changeset needed".

name: Check that the PR has a changeset

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled
      - ready_for_review

jobs:
  check-if-changeset:
    name: Check that PR has a changeset
    if: >-
      ${{ !contains(github.event.pull_request.labels.*.name, 'no changeset needed') && !startsWith(github.head_ref, 'changeset-release/') }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up the environment
        uses: ./.github/actions/setup-env

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # `changeset status` compares against the base branch and exits non-zero
      # when a package has changed without a changeset to describe it
      - name: Check if PR has a changeset
        run: pnpm changeset status --since=origin/${{ github.base_ref }}
