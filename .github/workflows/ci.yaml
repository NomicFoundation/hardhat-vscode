on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        node: [22.15.1, 24.x]

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Set up the environment
        uses: ./.github/actions/setup-env
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Download foundryup
        if: runner.os != 'Windows'
        run: curl -L https://foundry.paradigm.xyz | bash

      - name: Install foundry
        if: runner.os != 'Windows'
        run: ${XDG_CONFIG_HOME:-$HOME}/.foundry/bin/foundryup

      - name: Build project
        run: pnpm run build

      - name: Run server tests
        run: pnpm run test:codecov

      - name: Run protocol tests
        run: pnpm run test:protocol

      # `runTests` puts its download in `.vscode-test` relative to the cwd, and
      # the suite runs from `test/e2e`. Caching `.vscode-test` at the root
      # matched nothing, so every job re-downloaded VS Code.
      - name: Cache VS Code client
        id: cache-vscode
        uses: actions/cache@v4
        env:
          cache-name: cache-vscode
        with:
          path: test/e2e/.vscode-test
          key: ${{ runner.os }}-vscode-1.101.0

      - name: Run E2E tests
        uses: coactions/setup-xvfb@v1.0.1
        with:
          run: pnpm run test:e2e

      - name: Package the extension
        env:
          SOLIDITY_GA_SECRET: "dummy-value"
          SOLIDITY_GOOGLE_TRACKING_ID: "dummy-value"
          SOLIDITY_SENTRY_DSN: "dummy-value"
        run: pnpm run package

      - name: Publish code coverage
        uses: codecov/codecov-action@v4.2.0
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: ./server/coverage/lcov.info # __LCOV_RESULTS_INFO_FILE__ (keep in sync)
          disable_search: true
