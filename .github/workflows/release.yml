name: Create release PR / Publish packages

on:
  workflow_dispatch:
  push:
    branches:
      - main

defaults:
  run:
    shell: bash

jobs:
  pr:
    name: Conditionally create a release PR
    timeout-minutes: 60
    runs-on: ubuntu-latest
    outputs:
      hasChangesets: ${{ steps.store-has-changesets.outputs.hasChangesets }}
    permissions:
      pull-requests: write # This allows us to create pull requests
      contents: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This makes Actions fetch all Git history so that Changesets can generate changelogs with the correct commits
          fetch-depth: 0
          # NOTE: If we use default GITHUB_TOKEN to create the release PR, the checks on the release PR will not be triggered automatically
          token: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}

      - name: Set up the environment
        uses: ./.github/actions/setup-env
        with:
          # The release scripts are TypeScript, run directly; type stripping
          # needs a newer Node than the extension's own floor.
          node-version: 24

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Create release Pull Request
        id: pr
        env:
          # NOTE: If we use the default GITHUB_TOKEN to create the release PR, the checks on the release PR will not be triggered automatically
          GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          title: Version Packages
          version: pnpm release:version

      - name: Store hasChangesets for subsequent jobs
        id: store-has-changesets
        run: |
          echo "hasChangesets=${{steps.pr.outputs.hasChangesets}}"
          echo "hasChangesets=${{steps.pr.outputs.hasChangesets}}" >> $GITHUB_OUTPUT

      # The following two steps are to mark the changesets PR as draft
      # This is so a user must mark it as ready for review, which will trigger workflows on this PR
      # Otherwise workflows won't run since the PR is created by an action itself

      # A PR opened by an action does not trigger its own checks; converting it
      # to a draft means a person has to mark it ready, which does.
      - name: Convert the release PR to a draft
        if: steps.pr.outputs.hasChangesets == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/main.ts prepare-release-pr:set-as-draft

  pack:
    name: Generate tarballs and the vsix for publishing
    needs: pr
    if: needs.pr.outputs.hasChangesets == 'false'
    timeout-minutes: 60
    runs-on: ubuntu-latest
    outputs:
      hasPackages: ${{ steps.pack.outputs.hasPackages }}
      version: ${{ steps.pack.outputs.version }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the environment
        uses: ./.github/actions/setup-env
        with:
          # The release scripts are TypeScript, run directly; type stripping
          # needs a newer Node than the extension's own floor.
          node-version: 24

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # The language server's `prepack` bundles the server, which inlines the
      # analytics values, so packing needs them just as packaging the vsix does.
      - name: Pack the tarballs and the vsix
        id: pack
        env:
          SOLIDITY_GA_SECRET: ${{ secrets.SOLIDITY_GA_SECRET }}
          SOLIDITY_GOOGLE_TRACKING_ID: ${{ secrets.SOLIDITY_GOOGLE_TRACKING_ID }}
          SOLIDITY_SENTRY_DSN: ${{ secrets.SOLIDITY_SENTRY_DSN }}
        run: node scripts/release/main.ts pack

      - name: Store the package list to be published
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pnpm-publish-summary.json
          path: pnpm-publish-summary.json
          overwrite: true
          if-no-files-found: error

      - name: Upload packed tarballs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.pack.outputs.hasPackages == 'true'
        with:
          name: tarballs
          path: tarballs
          overwrite: true
          if-no-files-found: error

      - name: Upload the vsix
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.pack.outputs.hasPackages == 'true'
        with:
          name: vsix
          path: client/*.vsix
          overwrite: true
          if-no-files-found: error

  review:
    name: Review diffs
    needs: pack
    if: needs.pack.outputs.hasPackages == 'true'
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      actions: read # To download the artifacts to review
      contents: read # To read the previous release's vsix
    steps:
      # For the scripts these steps run; the artifacts are what is reviewed
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the environment
        uses: ./.github/actions/setup-env
        with:
          # The release scripts are TypeScript, run directly; type stripping
          # needs a newer Node than the extension's own floor.
          node-version: 24

      - name: Download pnpm list json
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pnpm-publish-summary.json
          path: .

      - name: Download tarballs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tarballs
          path: tarballs

      - name: Download the vsix
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vsix
          path: vsix

      - name: Review the packed artifacts against what is already released
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/main.ts review

  publish:
    name: Publish packages
    needs: [pack, review]
    if: needs.pack.outputs.hasPackages == 'true'
    timeout-minutes: 60
    runs-on: ubuntu-latest
    # The gate. Its reviewers establish that a release was triggered
    # deliberately by one of us; smoke testing the vsix from the run first is
    # optional.
    environment: publish
    permissions:
      actions: read # To download the artifacts to publish
      id-token: write # Needed for npm Trusted Publishing (OIDC)
      contents: read # For the scripts these steps run
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download pnpm list json
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pnpm-publish-summary.json
          path: .

      - name: Download tarballs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tarballs
          path: tarballs

      - name: Download the vsix
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vsix
          path: vsix

      # 24 for two reasons: npm new enough for Trusted Publishing, and type
      # stripping for the release scripts.
      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Update npm to make sure it supports Trusted Publishing
        run: npm install -g npm@latest

      # npm goes through Trusted Publishing. Both marketplaces are token based
      # for now: Microsoft's supported path is Entra ID workload identity
      # federation with `vsce publish --azure-credential`, which needs a
      # managed identity and publisher membership set up outside this repo.
      - name: Publish to npm and both marketplaces
        env:
          NPM_CONFIG_PROVENANCE: true # explicitly enable NPM provenance
          VSCE_TOKEN: ${{ secrets.VSCE_TOKEN }}
          OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}
        run: node scripts/release/main.ts publish

  tag:
    name: Tag the release
    needs: [pack, publish]
    if: needs.pack.outputs.hasPackages == 'true'
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      actions: read # To download the vsix to attach to the release
      contents: write # needed to push tags and create the release
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up the environment
        uses: ./.github/actions/setup-env
        with:
          # The release scripts are TypeScript, run directly; type stripping
          # needs a newer Node than the extension's own floor.
          node-version: 24

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Download the vsix
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vsix
          path: vsix

      # This step is needed otherwise tag creation fails
      - run: |
          git config user.name  "github-actions"
          git config user.email "github-actions@users.noreply.github.com"

      # `changeset tag` covers the npm packages. The extension is private, so it
      # produces nothing for that; `vX.Y.Z` is the tag every release in this
      # repo has been cut against, and the one the GitHub release hangs off.
      - name: Tag the release and create it on GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.pack.outputs.version }}
        run: node scripts/release/main.ts tag
