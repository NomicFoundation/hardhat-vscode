packages:
  - "client"
  - "server"
  - "coc"
  - "test/e2e"
  - "test/protocol"

allowBuilds:
  "@vscode/vsce-sign": false
  esbuild: false
  keccak: false
  keytar: false
  secp256k1: false

hoistPattern:
  - "!@types/*"

minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - hardhat
  - "@nomicfoundation/*"
